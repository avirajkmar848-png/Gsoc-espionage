services:
  # Static site: Vite + React frontend served by Render's CDN
  - type: web
    name: gsoc-espionage
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      # SPA fallback: send all unknown paths to index.html for react-router
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
